name: 功能建议
description: 从游戏开发场景出发的改进建议
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明你在做游戏时遇到的问题。不要只填想新增的技能名字。
        当前公开入口是 Matt 正式 25 项加三个游戏入口；新入口需要单独评估。
  - type: textarea
    id: scene
    attributes:
      label: 游戏开发场景
      description: 你在做什么游戏、进行到哪一步、卡在哪里。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 现有技能为什么不够
      description: 已经试过哪些入口（例如 game-init、game-design、to-spec）。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 你希望得到什么结果
      description: 可检查的产出，而不是“再加一个技能”。
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: 主要客户端
      options:
        - Codex
        - ZCode
        - Grok Build
        - 尚未安装 / 不确定
  - type: textarea
    id: extra
    attributes:
      label: 其它上下文
      description: 可选。不要附带凭据。
