name: 功能建议
description: 从游戏开发场景出发的改进建议
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明你在做游戏时遇到的问题，不要只填想新增的技能名字。
        当前范围是 `skills/` 下的 20 项（8 项用户入口 + 12 项按需方法），能力面与已退役能力见 `docs/reference/capabilities.md`。新增技能需要单独评估，见 `CONTRIBUTING.md`。
  - type: textarea
    id: scene
    attributes:
      label: 游戏开发场景
      description: 你在做什么游戏、进行到哪一步、卡在哪里。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 现有技能为什么不够
      description: 已经试过哪些技能（例如 ask-gamestudio、grill-gamestudio-docs、tasks-gamestudio），它们各自缺了什么。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 你希望得到什么结果
      description: 可检查的产出，而不是「再加一个技能」。
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: 主要宿主 / Agent
      placeholder: 例如 Claude Code、Codex CLI、Qoder；未安装可留空
  - type: dropdown
    id: entry_type
    attributes:
      label: 你认为它属于
      options:
        - 用户入口（我请求时才启动）
        - 按需方法（Agent 在任务内组合）
        - 现有技能的改进
        - 不确定
  - type: textarea
    id: extra
    attributes:
      label: 其它上下文
      description: 可选。不要附带凭据。
