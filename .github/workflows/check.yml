name: check

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  static:
    name: 静态检查与文档导航
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装测试依赖
        run: python -m pip install --upgrade pip pytest

      - name: 技能布局与内容契约
        run: python -m pytest tests/test_skills_layout.py tests/test_docs_product.py -q

      - name: 文档导航、链接与版本一致性
        run: python scripts/validate-docs.py

  native-install:
    name: 原生安装验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 隔离安装测试
        env:
          DO_NOT_TRACK: '1'
          DISABLE_TELEMETRY: '1'
          USE_NPX: '1'
        run: bash scripts/install-smoke-test.sh
